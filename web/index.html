<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FairPlay Sports</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Public+Sans:wght@400;500;600&display=swap"
    >
    <style>
      /* Plain HTML/CSS, no framework: this is the only thing on screen while
         the JS bundle downloads and main.ts awaits the session refresh call,
         both of which can take a while on a cold backend. Vue's mount()
         replaces #app's contents outright, so this needs no cleanup code. */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #f8fafc;
        font-family: 'Public Sans', system-ui, sans-serif;
      }
      #initial-loader__spinner {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 3px solid #e0e7ff;
        border-top-color: #4f46e5;
        animation: initial-loader-spin 0.8s linear infinite;
      }
      #initial-loader__label {
        font-family: 'Space Grotesk', system-ui, sans-serif;
        font-weight: 700;
        font-size: 15px;
        color: #334155;
      }
      @keyframes initial-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="initial-loader">
        <div id="initial-loader__spinner"></div>
        <span id="initial-loader__label">FairPlay Sports</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
