name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    name: Backend tests (.NET / NUnit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore FairPlay.Sports.Backend.slnf

      - name: Build
        run: dotnet build FairPlay.Sports.Backend.slnf --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test FairPlay.Sports.Backend.slnf
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dotnet-test-results
          path: ./TestResults

  frontend-build:
    name: Frontend build (Vue 3 / type-check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build
